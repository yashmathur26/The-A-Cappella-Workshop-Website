name: Staff photo sync

# Pulls the Google Form "Picture here" Drive folder, processes any new
# teacher/TA photos (face-crop + sharpen), and commits them so Cloudflare
# redeploys. Runs in the cloud so it doesn't depend on anyone's laptop.

on:
  schedule:
    # 13:10 UTC ≈ 9:10 AM US Eastern (EDT). Daily through the camp season.
    - cron: "10 13 * * *"
  workflow_dispatch: {} # allow manual "Run workflow" from the Actions tab

permissions:
  contents: write

concurrency:
  group: staff-photo-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stop after the season ends (Aug 21, 2026)
        run: |
          if [ "$(date -u +%Y%m%d)" -gt "20260821" ]; then
            echo "Past the camp season — nothing to do."
            echo "STOP=1" >> "$GITHUB_ENV"
          fi

      - name: Set up Python
        if: env.STOP != '1'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: env.STOP != '1'
        run: pip install Pillow pillow-heif gdown opencv-python-headless numpy

      - name: Run sync
        if: env.STOP != '1'
        run: python scripts/staff-sync/sync.py

      - name: Commit & push new photos
        if: env.STOP != '1'
        run: |
          git config user.name "staff-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "Website Pictures Lexington/staff"
          if git diff --cached --quiet; then
            echo "No new or changed photos."
          else
            git commit -m "Staff photo sync: pull new uploads from Drive"
            git push
          fi
